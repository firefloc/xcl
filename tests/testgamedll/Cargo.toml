[package]
name = "testgame-mw"
description = "Fake game-shipped middleware DLL used by the XCL test title."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "testgame_mw"
crate-type = ["cdylib"]
path = "src/lib.rs"
# no tests: its test binary would import kernelx.dll (exit code 53 on the GNU target under Wine)
test = false
doctest = false
